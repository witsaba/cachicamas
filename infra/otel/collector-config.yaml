# ============================================================================
# Cachicamas — OpenTelemetry Collector configuration
#
# Topology:
#
#   application (Go)
#        │
#        │  OTLP/gRPC
#        ▼
#   otel-collector
#        │
#        │  pipeline "traces":
#        │    otlp → memory_limiter → resourcedetection → resource →
#        │    tail_sampling (NEW) → batch → otlp/jaeger + debug
#        │
#        │  pipeline "logs" / "metrics": otlp → … → batch → debug
#        ▼
#   jaeger (traces)   stdout (debug exporter, dev only)
#
# Tail-based sampling (collector contrib ≥ 0.79) keeps:
#   - 100% of traces with errors, exceptions, HTTP 5xx, gRPC non-OK,
#     or end-to-end latency > 1000 ms (composite AND policy)
#   - 5% of successful, fast, uneventful traces (probabilistic)
#   - 1% catch-all floor for any trace that matches no other policy
# Tune rates by editing the `probabilistic.sampling_percentage` values
# below. To disable tail sampling without removing the block, comment out
# the `tail_sampling` entry in the `traces.processor` pipeline.
#
# Jaeger v2 does NOT store logs (it is a tracing backend), so the logs
# pipeline emits only to the debug exporter. The otelslog bridge on the
# application side attaches trace_id / span_id to every log record, so
# `docker compose logs otel-collector | jq` shows a TraceID you can paste
# into the Jaeger UI to jump to the matching span. Swap `debug` for a
# real logs backend (Loki / Elasticsearch / Datadog Logs) without
# touching the application code.
#
# In production, swap the jaeger exporter for otlp/<vendor> (Tempo, Honeycomb,
# Datadog, etc.) without touching the application code.
# ============================================================================

receivers:
  # Standard OTLP receivers — applications speak these natively.
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 16
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Batch is the canonical efficiency processor — required for any non-trivial
  # traffic. Keep timeout low in dev so traces show up quickly in the UI.
  batch:
    timeout: 1s
    send_batch_size: 1024

  # Memory limiter prevents the collector from being OOM-killed under spikes.
  # 60% of the container memory limit is a safe default; we lowered it from
  # 80% to leave headroom for the tail_sampling processor's in-memory
  # decision cache (num_traces: 50000 ≈ 100MB working set). Tune if you bump
  # the container memory limit in docker-compose.
  memory_limiter:
    check_interval: 2s
    limit_percentage: 60
    spike_limit_percentage: 20

  # Surface useful attributes as first-class metric labels (env, service name).
  resource:
    attributes:
      - key: deployment.environment
        from_attribute: deployment.environment
        action: upsert
      - key: service.namespace
        from_attribute: service.namespace
        action: upsert

  # Resolves a development-quality span when the caller didn't provide one.
  # Cheap insurance for handlers that forget to instrument.
  #
  # `docker` was removed from the detector list: it tries to read
  # /var/run/docker.sock from inside the container, which is not mounted
  # in this compose setup, producing "Cannot connect to the Docker daemon"
  # warnings every 5s. Mounting the socket would expose the host daemon
  # to the collector (security implication), so we just skip the detector.
  resourcedetection:
    detectors: [env]
    timeout: 2s

  # Tail-based sampling — evaluates each trace after it completes (or after
  # `decision_wait` expires) and decides whether to keep or drop it.
  # Must be placed AFTER memory_limiter (to protect the cache) and BEFORE
  # batch (to avoid paying per-span CPU/memory for traces that get dropped).
  tail_sampling:
    # How long to wait for a trace's root span to end before forcing a
    # decision. 10s is the OTel default and explicit here for visibility.
    decision_wait: 10s
    # How many traces the collector can hold in the in-memory decision cache
    # simultaneously. Sized for dev traffic (≈1k req/min, 3x headroom).
    num_traces: 50000
    # Expected new-traces-per-second for cache eviction. Conservative
    # estimate; undersizing causes the sampler to evict traces before they
    # complete, forcing them to take the catch-all path.
    expected_new_traces_per_sec: 500
    policies:
      # 100% retention of "interesting" traces. All sub-policies are AND-ed
      # so a trace is kept only if it matches AT LEAST ONE of them.
      - name: keep-errors-and-slows
        type: composite
        composite:
          composite_sub_policy:
            - name: errors
              # OTel semantic convention: status_code=ERROR forces keep.
              type: status_code
              status_code:
                status_codes: [ERROR]
            - name: exceptions
              # Span carries an OTel "exception" event → keep.
              type: string_attribute
              string_attribute:
                key: exception.type
                values: []
                enabled_regex_matching: false
                invert_match: false
            - name: slow
              # End-to-end duration strictly greater than 1000 ms. The 1000
              # boundary itself is the design choice (see design.md, decision
              # #6): traces exactly at 1000 ms fall through to the
              # probabilistic samplers.
              type: latency
              latency:
                threshold_ms: 1000
            - name: http-5xx
              # HTTP server response codes 500..599. The OTel HTTP semantic
              # conventions place the status code on `http.response.status_code`.
              type: numeric_attribute
              numeric_attribute:
                key: http.response.status_code
                min_value: 500
                max_value: 599
            - name: grpc-not-ok
              # gRPC canonical status codes 1..16 are all non-OK. The OTel
              # gRPC conventions place the code on `rpc.grpc.status_code`.
              type: numeric_attribute
              numeric_attribute:
                key: rpc.grpc.status_code
                min_value: 1
                max_value: 16
          # NOTE: composite sub-policies are OR-ed by default. There is no
          # `composite_strategy` key in the contrib schema (verified against
          # opentelemetry-collector-contrib v0.137.0 config.go). A trace is
          # kept if ANY of the 5 sub-policies above matches.
          # For AND semantics across sub-policies, use `type: and` with
          # `and_sub_policy:` instead (NOT what we want here).

      # 5% probabilistic sample of the residual (successful, fast,
      # uneventful traffic). Provides a baseline for latency-distribution
      # and error-rate dashboards without retaining every happy-path trace.
      - name: probabilistic-happy
        type: probabilistic
        probabilistic:
          sampling_percentage: 5

      # 1% catch-all floor: any trace that does not match any other policy
      # is still exported at this rate. Prevents the "Jaeger shows zero
      # traces" silent failure mode when an attribute key changes upstream.
      - name: catch-all
        type: probabilistic
        probabilistic:
          sampling_percentage: 1

exporters:
  # --------------------------------------------------------------------------
  # Jaeger v2 — speaks native OTLP. We point at jaeger:4317 (gRPC) inside the
  # compose network. The jaeger image's OTLP receiver writes straight to its
  # in-memory store; the UI is exposed on host:16686.
  # --------------------------------------------------------------------------
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 5000
    retry_on_failure:
      enabled: true
      initial_interval: 500ms
      max_interval: 30s
      max_elapsed_time: 300s

  # Dev-only: pretty-print spans to stdout so you can `docker compose logs
  # otel-collector | grep span` and verify telemetry is flowing without
  # needing to open the Jaeger UI. Comment out in production.
  debug:
    verbosity: detailed
    sampling_initial: 5
    sampling_thereafter: 200

extensions:
  # The health endpoint is provided by the OTel Collector's main binary
  # on the `health_check` extension, but it is unmaintained and scheduled
  # for deprecation. The docker-compose healthcheck for this service runs
  # `/otelcol-contrib validate --config=...` instead, which does not need
  # this extension. Drop it to silence the "Unmaintained component" warn.
  #
  # pprof for debugging the collector itself.
  pprof:
    endpoint: 0.0.0.0:1777
  # zPages for at-a-glance pipeline health in dev.
  zpages:
    endpoint: 0.0.0.0:55679

service:
  telemetry:
    logs:
      level: info
    metrics:
      # level controls verbosity of the collector's internal metrics
      # (otelcol_*) which are emitted in-process; expose them on an HTTP
      # endpoint by adding a `prometheus` exporter + a metrics pipeline
      # listening on 0.0.0.0:8888 (or use the `service.telemetry`
      # `self_metrics` extension when running the configserver). For now
      # we keep the collector self-metrics in-process only.
      level: basic

  extensions: [pprof, zpages]

  pipelines:
    traces:
      receivers:  [otlp]
      processors: [memory_limiter, resourcedetection, resource, tail_sampling, batch]
      exporters:  [otlp/jaeger, debug]
    metrics:
      receivers:  [otlp]
      processors: [memory_limiter, resourcedetection, resource, batch]
      exporters:  [debug]   # add prometheus exporter here when you wire metrics UI
    logs:
      receivers:  [otlp]
      processors: [memory_limiter, resourcedetection, resource, batch]
      exporters:  [debug]   # swap for loki / elasticsearch when you add log UI