# pnpm 11+ project configuration.
# The `allowBuilds` key replaces the legacy `onlyBuiltDependencies` from
# pnpm <= 10. Without this, pnpm refuses to run install/build scripts for
# the listed packages, which breaks the Qwik dev server.
#
# Reference: https://pnpm.io/settings#allowbuilds
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  sharp: true

# Force patched transitive deps to clear high-severity advisories.
# Bump deltas are the minimum that resolves the GHSA listed in the
# repo-validation-harness audit output. Each entry collapses every
# matching range in the dep graph to a single tree-wide version.
#
# brace-expansion override: collapases every v1.x consumer to v2.1.4.
# v1.x and v2.x share the same module shape (`module.exports =
# expandTop`, the callable default), so minimatch@3.x (transitive
# via @eslint/config-array@0.21.2 -> eslint@9) keeps working
# unchanged. v2.1.4 already carries the DoS hardening that landed
# for CVE-2026-14257 / CVE-2026-13149 (EXPANSION_MAX = 100_000,
# EXPANSION_MAX_LENGTH = 4_000_000) — same protection v5.x has,
# minus the breaking ESM-only renames. v5.x is reachable in the
# tree today via minimatch@10.x, so the wide override never bumps
# the v5.x path. If minimatch@3 ever gets bumped upstream, drop
# this entry and rely on the v5.x path for everyone.
overrides:
  "brace-expansion@^1.0.0": "npm:brace-expansion@^2.1.4"
  "image-size@<2.0.3": ">=2.0.3"
  "js-yaml@<4.3.1": ">=4.3.1"
  "nanoid@<3.3.17": ">=3.3.17"
  "postcss@<8.5.18": ">=8.5.18"
  "sharp@<0.35.0": ">=0.35.0"
  "svgo@<3.3.4": ">=3.3.4"
  # esbuild@<0.28.1 dev-server file read (GHSA-g7r4-m6w7-qqqr,
  # Dependabot #1, frontend-vuln-check). esbuild is a transitive dep
  # of vite; vite@^7.3.5 pins ^0.27.0 in its own deps which would
  # otherwise win. Forcing ^0.28.0 collapses every transitive consumer
  # (vite, qwik, vitest, @tailwindcss/vite) to a single patched copy.
  # esbuild 0.27 → 0.28 is API-compatible for our build/test paths.
  "esbuild": "^0.28.1"
