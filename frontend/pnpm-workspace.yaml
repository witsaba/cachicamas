# pnpm 11+ project configuration.
# The `allowBuilds` key replaces the legacy `onlyBuiltDependencies` from
# pnpm <= 10. Without this, pnpm refuses to run install/build scripts for
# the listed packages, which breaks the Qwik dev server.
#
# Reference: https://pnpm.io/settings#allowbuilds
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  sharp: true

# GHSA-7rqj-j65f-68wh (@auth/core homoglyph email-normalization auth bypass,
# frontend-vuln-check): @auth/qwik@0.9.2 hard-pins @auth/core@0.41.2 as a
# regular (non-peer) dependency, so bumping the direct dependency alone
# leaves a second, vulnerable 0.41.2 copy resolved under @auth/qwik — the
# exact one the login path imports. This override forces a single
# tree-wide 0.41.3 resolution. 0.41.2 -> 0.41.3 is the patch containing
# only the security fix; the @auth/qwik@0.9.2 pin (docs/adr/0001-accept-authjs-qwik.md)
# is untouched.
overrides:
  "@auth/core": "0.41.3"
  # Force patched transitive deps to clear high-severity advisories.
  # Bump deltas are the minimum that resolves the GHSA listed in the
  # repo-validation-harness audit output. Each entry collapses every
  # matching range in the dep graph to a single tree-wide version.
  #
  # brace-expansion note: minimatch@3 (transitive via @eslint/config-array)
  # requires the v1.x API (the `expand` export). A blanket
  # `brace-expansion` override that bumps to v5.x breaks ESLint at
  # runtime, so we accept the brace-expansion 1.x / 2.x / 5.x vulns
  # here and document them in the repo-validation-harness allowlist
  # until minimatch@3 is itself bumped upstream.
  "image-size@<2.0.3": ">=2.0.3"
  "js-yaml@<4.3.1": ">=4.3.1"
  "nanoid@<3.3.17": ">=3.3.17"
  "postcss@<8.5.18": ">=8.5.18"
  "sharp@<0.35.0": ">=0.35.0"
  "svgo@<3.3.4": ">=3.3.4"
