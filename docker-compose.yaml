# ============================================================================
# Cachicamas — local infrastructure
#
# Brings up: postgres, otel-collector (gateway), jaeger, and the
# database_administrator microservice.
#
# Usage:
#   cp .env.example .env   # edit if needed
#   docker compose up -d --build
#   open http://localhost:16686          # Jaeger UI
#   curl http://localhost:8080/health    # microservice
#
# Compose v2 spec (no `version:` key by design).
# ============================================================================

name: cachicamas

services:
  # --------------------------------------------------------------------------
  # PostgreSQL 18 — primary datastore
  # --------------------------------------------------------------------------
  postgres:
    # Triple-pinned: Postgres 18 + alpine 3.24. The ':18-alpine' (or
    # ':latest') tag would silently roll forward to whatever alpine the
    # upstream maintainers publish next. Pin explicitly so security
    # upgrades are a visible commit.
    image: postgres:18-alpine3.24
    container_name: cachicamas-postgres
    restart: unless-stopped
    # NOTE: the postgres:18-alpine3.24 image prints a benign
    # "WARNING: no usable system locales were found" during initdb
    # because the Alpine base image doesn't ship a `locale` binary.
    # The cluster itself initializes fine with --locale=C (see the
    # "database cluster will be initialized with locale C" line right
    # above the warning). Silencing it would require overriding the
    # image entrypoint with apk+locale-gen, which is brittle and
    # not worth the trade-off for a non-fatal warning. Accepted.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cachicamas_pg}
      # POSTGRES_USER must be a superuser — the official image calls
      # `CREATE USER ... SUPERUSER` during initdb. The image requires this
      # account to bootstrap the cluster. The application's DBA role
      # (`queen`) is provisioned separately by infra/postgres/init/01-init.sql.
      POSTGRES_USER: ${POSTGRES_USER:-cachicamas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (set it in .env)}
      # --locale=C is rejected by the postgres:18-alpine image with
      # "no usable system locales were found" because Alpine ships a
      # minimal musl libc and no locale binary. Set LANG/LC_ALL to
      # C.UTF-8 (built into glibc/musl on most distros) and pass only
      # --encoding=UTF8 to initdb. Production should pin a real locale.
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS:---encoding=UTF8}
      # Password for the DBA role provisioned by infra/postgres/init/01-init.sql.
      # Read inside the SQL via psql's \getenv QUEEN_PASSWORD.
      QUEEN_PASSWORD: ${QUEEN_PASSWORD:-changeme-queen}
      # postgres:18 stores data under /var/lib/postgresql/18/docker by default.
      # We keep the default to align with the official image.
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - cachicamas_network
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" || exit 1'
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --------------------------------------------------------------------------
  # Jaeger v2 — distributed tracing UI + storage (all-in-one for dev)
  # --------------------------------------------------------------------------
  jaeger:
    # Pin to a specific patch (2.19.0, released 2026-06-03) instead of
    # 'latest' or a floating tag, so security fixes are an explicit
    # commit instead of an auto-pull.
    image: jaegertracing/jaeger:2.19.0
    container_name: cachicamas-jaeger
    restart: unless-stopped
    # Use a custom config file (see infra/jaeger/all-in-one.yaml) instead
    # of the built-in all-in-one config. The built-in config:
    #   - binds OTLP receivers to `localhost` (unreachable from the
    #     otel-collector container on the compose network);
    #   - binds jaeger_query and remote_sampling to `0.0.0.0` and emits
    #     DoS-warning logs every startup.
    # The custom config silences all of that and binds things to the
    # right interfaces for this compose setup.
    #
    # NOTE: COLLECTOR_OTLP_ENABLED was a Jaeger v1 flag and is silently
    # ignored in v2. Don't rely on it — use the OTLP receivers in the
    # config file instead.
    command:
      - --config=/etc/jaeger/config.yaml
    volumes:
      - ./infra/jaeger/all-in-one.yaml:/etc/jaeger/config.yaml:ro
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686" # UI
      - "${JAEGER_OTLP_GRPC_PORT:-4317}:4317" # OTLP gRPC
      - "${JAEGER_OTLP_HTTP_PORT:-4318}:4318" # OTLP HTTP
    networks:
      - cachicamas_network
    healthcheck:
      # Use 127.0.0.1 explicitly. The jaeger_query extension binds to
      # 127.0.0.1 (see infra/jaeger/all-in-one.yaml), and `localhost`
      # occasionally resolves weirdly in busybox wget.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:16686/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --------------------------------------------------------------------------
  # OpenTelemetry Collector — gateway
  # Receives OTLP from apps, batches, exports to Jaeger.
  # --------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.137.0
    container_name: cachicamas-otel-collector
    restart: unless-stopped
    # Pin the container to 512MB so `memory_limiter.limit_percentage: 60`
    # in collector-config.yaml has a concrete ceiling to operate against.
    # Without an explicit limit, Docker Desktop (no cgroup limit) makes
    # `memory_limiter` a no-op — see CR4 in the verify report.
    mem_limit: 512m
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel/collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      # Host-port for the collector's OTLP gRPC receiver. The collector
      # itself listens on :4317 inside the container; only the host-side
      # mapping is shifted to :14317 so it does not collide with Jaeger's
      # own :4317 publish (Docker Desktop's vpnkit sidecar can hold a
      # stale :4317 bind across container restarts).
      - "${OTEL_COLLECTOR_GRPC_PORT:-14317}:4317" # OTLP gRPC from apps
      - "${OTEL_COLLECTOR_HTTP_PORT:-14318}:4318" # OTLP HTTP from apps
      - "${OTEL_COLLECTOR_HEALTH_PORT:-13133}:13133" # health_check extension
    networks:
      - cachicamas_network
    depends_on:
      jaeger:
        condition: service_healthy
    healthcheck:
      # The OTel Collector image is a single static binary (no shell, no
      # wget, no curl). Use that same binary to validate the config — if
      # the config file stays parseable and the pipeline stays valid,
      # exit 0; otherwise this fails and the container is marked unhealthy.
      test:
        [
          "CMD",
          "/otelcol-contrib",
          "validate",
          "--config=/etc/otelcol/config.yaml",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --------------------------------------------------------------------------
  # database_administrator — Go microservice
  # --------------------------------------------------------------------------
  database_administrator:
    build:
      context: ./backend/database_administrator
      dockerfile: Dockerfile
    image: cachicamas/database_administrator:local
    container_name: cachicamas-database-administrator
    restart: unless-stopped
    environment:
      SERVICE_NAME: database_administrator
      SERVICE_ENV: ${SERVICE_ENV:-development}
      SERVICE_PORT: ${SERVICE_PORT:-8080}
      # Database — connects as `queen` (the DBA role provisioned by
      # infra/postgres/init/01-init.sql). Today this is the only non-
      # superuser role that exists at boot. To switch to a least-privilege
      # app role later, create it as queen (see recipe at the bottom of
      # 01-init.sql) and update POSTGRES_USER / POSTGRES_PASSWORD here.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-cachicamas_pg}
      POSTGRES_USER: ${QUEEN_USER:-queen}
      POSTGRES_PASSWORD: ${QUEEN_PASSWORD:-changeme-queen}
      # Local dev compose runs plain Postgres (no TLS termination).
      # database_administrator's Go default sslmode=require
      # (backend/database_administrator/src/migration/postgres/driver.go:81)
      # fails on a plain Postgres with `tls error: server refused TLS
      # connection`. Override to `disable` here; production should set
      # `require` or `verify-full` in their own env file.
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
# OpenTelemetry
      OTEL_SERVICE_NAME: database_administrator
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      # cachicamas-github-login (PR-3) — JWE cookie verification.
      # The Go service uses the SAME AUTH_SECRET as the frontend
      # to decrypt the Auth.js session cookie. Without this env
      # the verifier middleware (PR-3) refuses to start; PR-2
      # already fails the same way if the frontend env block is
      # missing these vars (fail-fast posture, consistent with
      # the project's db-migrations R-DBMIG-050).
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set in .env (openssl rand -base64 32)}
      # cachicamas-identity-signin-callback — HMAC-SHA256 secret for
      # the identity signin-callback endpoint. MUST be the same
      # value the frontend uses to sign requests (set in its env
      # block below). Different from AUTH_SECRET (purpose + rotation
      # cadence differ). Generate with `openssl rand -base64 32`.
      IDENTITY_CALLBACK_SECRET: ${IDENTITY_CALLBACK_SECRET:?IDENTITY_CALLBACK_SECRET must be set in .env (openssl rand -base64 32)}
      # 2026-07-08-workspace-sync-clone PR-3b: bearer token for
      # the workspace_syncer client. MUST match the value in the
      # workspace_syncer INTERNAL_SERVICE_TOKEN env. Defaults to a
      # placeholder so the database_administrator boots without the
      # syncer service (the sync endpoints are wired, the dispatcher
      # silently no-ops without a real token).
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-changeme-internal-service-token-must-be-set-when-syncer-wired}
      # 2026-07-08-workspace-sync-clone PR-3b: HMAC-SHA256 secret
      # for the workspace_syncer internal sync-callback
      # (POST /api/v1/internal/sync-callback). MUST match the value
      # in the workspace_syncer SYNC_CALLBACK_SECRET env. Same
      # placeholder pattern as INTERNAL_SERVICE_TOKEN.
      SYNC_CALLBACK_SECRET: ${SYNC_CALLBACK_SECRET:-changeme-sync-callback-secret-must-be-set-when-syncer-wired}
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=${PROJECT_NAME:-cachicamas},deployment.environment=${SERVICE_ENV:-development}
    ports:
      - "${SERVICE_PORT:-8080}:8080"
    networks:
      - cachicamas_network
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
      # 2026-07-08-workspace-sync-clone: syncer wires the
      # workspace_syncer HTTP client; we do not block on it
      # being healthy because the healthcheck is disabled
      # (no shell in distroless image). service_started is
      # sufficient.
      workspace_syncer:
        condition: service_started
    healthcheck:
      # Disabled on purpose. The runtime image is distroless/static, which
      # has no shell, no wget, no curl, no nc — verified by extracting
      # /usr/bin and /bin from the image and listing them (both empty).
      # A `CMD-SHELL` healthcheck fails with "exec: /bin/sh: no such file
      # or directory" before the test even runs.
      #
      # Verify the service from the host instead:
      #   curl -sS http://localhost:8080/health
      #   # → {"status":"ok"}
      #
      # If you need a Docker-level healthcheck, the cleanest path is a
      # tiny static Go binary that does a TCP connect to localhost:8080
      # and exits 0/1 — copy it into the image and reference it here.
      disable: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --------------------------------------------------------------------------
  # frontend — Qwik Node SSR (no nginx, single Node process).
  # Multi-stage Dockerfile: node:22-alpine builder + node:22-alpine runner.
  # El Qwik server:
  #   - Sirve los static assets (dist/) con cache headers.
  #   - Reverse-proxy /api/* → http://database_administrator:8080 (strip prefix).
  #   - SSR para todas las rutas, incluyendo dinámicas (/organizations/{id}/).
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # URL que el browser usa para hablar con el Go bin.
        # Default: /api (relativo — el Qwik server hace el reverse proxy).
        # Override para saltar el proxy: PUBLIC_API_BASE_URL=http://localhost:8080.
        PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-/api}
        # Origin canónico (canonical/OG tags, CSRF).
        ORIGIN: ${ORIGIN:-http://localhost:3015}
    image: cachicamas/frontend:local
    container_name: cachicamas-frontend
    restart: unless-stopped
    environment:
      # Runtime env (post-build). Cachicamas-github-login (PR-2):
      # Auth.js + GitHub OAuth requires these at process start so the
      # Node SSR server can read them per-request via ev.env.get(...).
      # All four AUTH_* keys are required (compose refuses to start if
      # any is missing — see the :?msg suffix below).
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      API_TARGET: http://database_administrator:8080
      PUBLIC_API_BASE_URL: /api
      SERVER_API_BASE_URL: http://database_administrator:8080
      ORIGIN: ${ORIGIN:-http://localhost:3015}
      # cachicamas-github-login — Auth.js + GitHub OAuth (PR-2)
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:?AUTH_GITHUB_ID must be set in .env}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:?AUTH_GITHUB_SECRET must be set in .env}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set in .env (openssl rand -base64 32)}
      AUTH_TRUST_HOST: "true"
      AUTH_URL: ${AUTH_URL:-http://localhost:3015}
      # cachicamas-identity-signin-callback — HMAC-SHA256 secret
      # used by frontend/src/lib/identity-callback-client.ts to sign
      # requests to database_administrator:8080/api/v1/identity/signin-callback.
      # MUST equal the IDENTITY_CALLBACK_SECRET in the
      # database_administrator env block above (same value, same
      # rotation cadence). Generate with `openssl rand -base64 32`.
      IDENTITY_CALLBACK_SECRET: ${IDENTITY_CALLBACK_SECRET:?IDENTITY_CALLBACK_SECRET must be set in .env (openssl rand -base64 32)}
    ports:
      - "${FRONTEND_PORT:-3015}:3000"
    networks:
      - cachicamas_network
    depends_on:
      database_administrator:
        condition: service_started
    healthcheck:
      # node:22-alpine NO trae wget/curl. Usamos node inline para
      # hacer un fetch al endpoint raíz y exit 0/1 según status.
      test:
        - CMD-SHELL
        - 'node -e "require(\"http\").get(\"http://127.0.0.1:3000/\",r=>process.exit(r.statusCode<400?0:1)).on(\"error\",()=>process.exit(1))"'
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging:
          driver: json-file
          options:
            max-size: "10m"
            max-file: "3"

      # --------------------------------------------------------------------------
      # mocks-github-oauth — minimal GitHub OAuth simulator for the Playwright
      # e2e suite (cachicamas-github-login PR-2 T2.20). NOT for production.
      # The frontend's AUTH_GITHUB_BASE_URL / AUTH_GITHUB_API_BASE_URL env vars
      # point here in the test profile; production (no override) hits real
      # github.com.
      # --------------------------------------------------------------------------
  mocks-github-oauth:
        build:
          context: ./scripts/mocks-github-oauth
          dockerfile: Dockerfile
        image: cachicamas/mocks-github-oauth:local
        container_name: cachicamas-mocks-github-oauth
        restart: "no"
        environment:
          MOCKS_HOST: 0.0.0.0
          MOCKS_PORT: 3016
        ports:
          # Host-side port for browser-driven e2e tests when running
          # compose WITHOUT the dockerized frontend (e.g., pnpm dev
          # locally + docker compose up for postgres/db-admin/mocks).
          - "3016:3016"
        networks:
          - cachicamas_network
        healthcheck:
          test:
            - CMD-SHELL
            - 'node -e "require(\"http\").get(\"http://127.0.0.1:3016/healthz\",r=>process.exit(r.statusCode===200?0:1)).on(\"error\",()=>process.exit(1))"'
          interval: 10s
          timeout: 5s
          retries: 6
          start_period: 5s

  # --------------------------------------------------------------------------
  # workspace_syncer — Go microservice (2026-07-08-workspace-sync-clone).
  # Clones GitHub repos server-side + probes worktrees. Reached only by
  # database_administrator over the docker network; never exposed to the
  # host (no ports: directive). Internal-only.
  # --------------------------------------------------------------------------
  workspace_syncer:
    build:
      context: ./backend/workspace_syncer
      dockerfile: Dockerfile
    image: cachicamas/workspace_syncer:local
    container_name: cachicamas-workspace-syncer
    restart: unless-stopped
    environment:
      SERVICE_NAME: workspace_syncer
      SERVICE_ENV: ${SERVICE_ENV:-development}
      # 2026-07-08-workspace-sync-clone: the syncer code reads
      # WORKSPACE_SYNCER_PORT (not SERVICE_PORT) for its bind port.
      # The database_administrator dispatches to port 8080 (see
      # WORKSPACE_SYNCER_URL in its env block), so we MUST align
      # them here. Override in .env if needed.
      WORKSPACE_SYNCER_PORT: ${WORKSPACE_SYNCER_PORT:-8080}
      # 2026-07-08-workspace-sync-clone: bearer token verified by the
      # syncer middleware (subtle.ConstantTimeCompare). MUST match
      # the database_administrator INTERNAL_SERVICE_TOKEN value
      # (default placeholder keeps both services in sync when
      # neither value is set; production MUST set a real value in .env).
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-changeme-internal-service-token-must-be-set-when-syncer-wired}
      # 2026-07-08-workspace-sync-clone: HMAC-SHA256 secret the syncer
      # uses to sign its callback body. The database_administrator
      # verifies the signature on POST /api/v1/internal/sync-callback.
      # MUST match the SYNC_CALLBACK_SECRET on db_admin.
      SYNC_CALLBACK_SECRET: ${SYNC_CALLBACK_SECRET:-changeme-sync-callback-secret-must-be-set-when-syncer-wired}
      # The base URL of database_administrator (the syncer posts
      # the callback here). Default points at the docker-compose
      # service name; override only for dev/test.
      DATABASE_ADMINISTRATOR_URL: ${DATABASE_ADMINISTRATOR_URL:-http://database_administrator:8080}
      # OTEL — mirrors db_admin.
      OTEL_SERVICE_NAME: workspace_syncer
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=${PROJECT_NAME:-cachicamas},deployment.environment=${SERVICE_ENV:-development}
    # Internal-only: NO ports: directive. Reachable only via the
    # docker network (database_administrator calls http://workspace_syncer:8080).
    networks:
      - cachicamas_network
    # NOTE: no depends_on db_admin here — the syncer does NOT need
    # db_admin at startup. The callback is best-effort and can fail
    # (the job stays in pending; the next sync attempt will reconcile).
    # Adding a depends_on would create a cycle (db_admin depends_on
    # workspace_syncer for the dispatch, workspace_syncer depends_on
    # db_admin for the callback).
    volumes:
      # /data/workspaces is the syncer clone target. Named volume
      # so the data survives container restarts (the startup sweep
      # at PR-2c reconciles the directory against db_admin live
      # workspaces).
      - workspace_syncer_data:/data/workspaces
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # ----- Shared network ----------------------------------------------------
networks:
  cachicamas_network:
    name: cachicamas_network
    driver: bridge

# ----- Named volumes -----------------------------------------------------
volumes:
  postgres-data:
    name: cachicamas-postgres-data
  workspace_syncer_data:
    name: cachicamas-workspace-syncer-data
