# Mirrors backend/database_administrator/.golangci.yml.
# Pinned golangci-lint version: v2.9.0 (see Makefile).
version: "2"

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - revive

run:
  timeout: 5m
  tests: true

issues:
  max-issues-per-linter: 50
  max-same-issues: 0
