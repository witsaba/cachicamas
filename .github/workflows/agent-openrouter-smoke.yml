# AI-39.1 — the live OpenRouter smoke workflow (R-OR-07, design D7,
# tasks.md § PR #3 work unit 3.3).
#
# # What this file is
#
# The opt-in CI lane that gates the live OpenRouter HTTP call the
# smoke sub-package's TestOpenRouterAdapter_LiveSmoke performs.
# The workflow is workflow_dispatch-only — no schedule, no push,
# no pull_request trigger — so the regular CI pipeline never makes
# a real-money call. The branch the smoke exercises is the
# PR #3 branch the dispatch happens on; the workflow reads the
# OPENROUTER_API_KEY from repo secrets and the explicit opt-in flag
# from the dispatch input.
#
# # Why the two-stage gate
#
# R-OR-07 mandates a two-stage gate: the bearer alone is not consent,
# the run-flag alone is not the secret. The smoke test checks both
# env vars at runtime (TestLiveSmokeGate_*); this workflow only
# sets RUN_LIVE_OPENROUTER_SMOKE=1 when the dispatch input is true.
# When the input is false (the default), the env var is empty and
# the smoke test skips with an attributable message.
#
# # Why the concurrency group
#
# OpenRouter's free-tier rate-limits overlap (design § 9); the
# concurrency group serializes overlapping dispatches so the second
# dispatch waits for the first to finish. cancel-in-progress: false
# preserves the queued dispatch's intent — a follow-up dispatch
# that arrived while the first was running will run after it
# finishes, not replace it.
#
# # Why the absent-secret path is a notice, not a failure
#
# Spec: "absent secret → smoke skipped, job succeeds with a notice".
# The notice is a GitHub Actions ::notice annotation so the run
# summary names the missing secret without failing the job. The
# `make test` step below still runs (and passes) so the skip path
# is exercised end-to-end on every dispatch.
#
# # Why timeout-minutes is 10
#
# Live OpenRouter requests can take up to 60 s (liveSmokeRequestTimeout
# in smoke_test.go). The dispatch's outer bound is 10 minutes,
# generous enough to fit one live request plus `make test` plus
# the workflow's bootstrap, tight enough that a hung CI agent
# can't hold the runner indefinitely.

name: agent-openrouter-smoke

on:
  workflow_dispatch:
    inputs:
      run_smoke:
        description: 'Run the live OpenRouter smoke (requires OPENROUTER_API_KEY repo secret; when false/omitted, the workflow reports a skip notice).'
        required: false
        type: boolean
        default: false

# Without an explicit concurrency group, overlapping dispatches would
# race on the same OpenRouter bearer and rate-limit each other
# (design § 9's :free flakiness risk). The group serializes them.
concurrency:
  group: openrouter-live-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: live openrouter smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          # cache: false — the agent module has zero requires; caching
          # $GOPATH/pkg/mod is unnecessary and would only add a
          # maintenance surface for the cache-key.

      # The make test step always runs. Under normal CI (no env vars),
      # the smoke sub-package reports SKIP and the suite exits 0. The
      # step is bounded by Go's own test timeout; the dispatch input
      # does not influence this step.
      - name: run full module test suite (skip path is the green path)
        run: make test
        working-directory: backend/agent

      # The live smoke step. The env-var conditional is set on the
      # step, not at the workflow level, so the conditional logic is
      # readable in one place. RUN_LIVE_OPENROUTER_SMOKE is set to '1'
      # only when the dispatch input is true; the smoke test
      # additionally requires OPENROUTER_API_KEY to be set (the
      # two-stage gate).
      - name: run live openrouter smoke
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RUN_LIVE_OPENROUTER_SMOKE: ${{ github.event.inputs.run_smoke == 'true' && '1' || '' }}
        run: |
          set -euo pipefail
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "::notice title=Live smoke skipped::OPENROUTER_API_KEY secret is not set on this repository; the live smoke is opt-in (R-OR-07). Set the secret in Settings → Secrets and variables → Actions to enable the live path."
            exit 0
          fi
          if [ "${RUN_LIVE_OPENROUTER_SMOKE:-}" != "1" ]; then
            echo "::notice title=Live smoke skipped::RUN_LIVE_OPENROUTER_SMOKE is not 1 (dispatch input was false); the skip path is the green path under dispatch when the live opt-in is off."
            exit 0
          fi
          go test -race -v ./src/ai/openaicompat/openrouter/smoke/...
        working-directory: backend/agent
